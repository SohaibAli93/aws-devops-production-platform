  docker-build:

    name: Docker Build

    runs-on: ubuntu-latest

    needs: backend-tests

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build \
            -t devops-backend:${{ github.sha }} \
            ./application/backend

      - name: Build frontend image
        run: |
          docker build \
            -t devops-frontend:${{ github.sha }} \
            ./application/frontend

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "devops-backend:${{ github.sha }}"
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "devops-frontend:${{ github.sha }}"
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"