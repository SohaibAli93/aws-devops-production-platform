services:

  backend:
    build:
      context: ./application/backend
    container_name: devops-backend

    restart: unless-stopped

    environment:
      APP_ENV: docker

    ports:
      - "5000:5000"

    networks:
      - devops-network

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


  frontend:
    build:
      context: ./application/frontend

    container_name: devops-frontend


    restart: unless-stopped

    ports:
      - "8080:80"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - devops-network


networks:

  devops-network:
    driver: bridge